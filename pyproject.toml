[project]
name = "stock-link-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "coverage>=7.10.1",
    "datetimejp>=1.1.0",
    "fastapi>=0.115.0",
    "jaconv>=0.4.0",
    "lxml>=6.0.0",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.1",
    "pyshorteners>=1.0.1",
    "pytest>=8.4.1",
    "requests>=2.32.4",
    "ruff>=0.12.7",
    "tqdm>=4.67.1",
    "uvicorn[standard]>=0.32.0",
    "watchdog>=3.0.0",
    "wikipedia>=1.4.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6.8",
    "ruff>=0.8.0",
    "pytest>=8.3.3",
]

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.lint]
# Enable the same error codes as flake8 configuration
select = [
    "E9",   # Runtime errors
    "F63",  # Invalid print syntax
    "F7",   # Syntax errors in type comments
    "F82",  # Undefined name in __all__
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "C90",  # mccabe complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
