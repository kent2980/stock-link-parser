services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-link-parser-postgres
    environment:
      POSTGRES_DB: ${XBRL_DB_DATABASE:-xbrl}
      POSTGRES_USER: ${XBRL_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${XBRL_DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${XBRL_DB_PORT:-5432}:5432"
    networks:
      - stock-link-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${XBRL_DB_USERNAME:-postgres} -d ${XBRL_DB_DATABASE:-xbrl}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  stock-link-parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-link-parser
    image: stock-link-parser:latest
    
    # 環境変数（.envファイルから読み込む）
    env_file:
      - .env
    
    # 環境変数の直接指定（必要に応じて）
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    
    # ボリュームマウント
    volumes:
      # データディレクトリ（XBRLファイルなど）
      - ./data:/app/data:ro
      # 出力ディレクトリ
      - ./output:/app/output
      # ログディレクトリ
      - ./logs:/app/logs
      # 設定ファイル（必要に応じて）
      - ./.env:/app/.env:ro
    
    # ネットワーク設定
    networks:
      - stock-link-network
    
    # PostgreSQLコンテナへの依存関係
    depends_on:
      postgres:
        condition: service_healthy
    
    # リソース制限
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # 再起動ポリシー
    restart: unless-stopped
    
    # ヘルスチェック
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stock-link-parser-api
    image: stock-link-parser-api:latest
    
    # 環境変数（.envファイルから読み込む）
    env_file:
      - .env
    
    # 環境変数の直接指定
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    
    # ボリュームマウント
    volumes:
      # データディレクトリ（XBRLファイルなど）
      - ./data:/app/data:ro
      # 出力ディレクトリ
      - ./output:/app/output
      # ログディレクトリ
      - ./logs:/app/logs
      # 設定ファイル
      - ./.env:/app/.env:ro
    
    # ポートマッピング
    ports:
      - "8000:8000"
    
    # ネットワーク設定
    networks:
      - stock-link-network
    
    # リソース制限
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # 再起動ポリシー
    restart: unless-stopped
    
    # ヘルスチェック
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 依存関係（stock-link-parserサービスが先に起動）
    depends_on:
      - stock-link-parser
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: stock-link-parser-web
    image: stock-link-parser-web:latest
    
    # ボリュームマウント（開発用）
    volumes:
      - ./frontend:/app
      - /app/node_modules
    
    # ポートマッピング
    ports:
      - "3000:3000"
    
    # 環境変数
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    
    # ネットワーク設定
    networks:
      - stock-link-network
    
    # 依存関係
    depends_on:
      - api
    
    # 再起動ポリシー
    restart: unless-stopped

networks:
  stock-link-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
